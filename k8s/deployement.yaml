apiVersion: apps/v1
kind: Deployment
metadata:
  name: rpc-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rpc-server
  template:
    metadata:
      labels:
        app: rpc-server
    spec:
      containers:
        - name: rpc-server
          image: danireg73/rpc-server:latest
          ports:
            - containerPort: 5000